# The ONLY public Ingress: two hosts, one internet-facing ALB. It lives in the api chart because from stage 5 the api
# rule carries the canary's weighted forward action.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: anime-public
  annotations:
    # Before the pods (their Deployment or Rollout is wave 0 of this Application): the target group binding must exist
    # when the api pods are created, or the readiness gate is not injected into them
    # (deploy/platform/base/namespace.yaml). From stage 5 that holds for the first Rollout's pods only; a canary's pods
    # are created before their Service selects them, and target-group verification covers them instead (design §4.7).
    argocd.argoproj.io/sync-wave: "-1"
    alb.ingress.kubernetes.io/scheme: internet-facing
    # Pods are targets by their own IP: no hop through a node port that could hand a request to the other version, and
    # readiness gates only mean something for IP targets (GitOps A3.4).
    alb.ingress.kubernetes.io/target-type: ip
    # Port 80 exists only to answer 301; the client then reconnects to 443 itself.
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80},{"HTTPS":443}]'
    alb.ingress.kubernetes.io/ssl-redirect: "443"
    # Named by ARN: never let the controller pick a certificate by host match (GitOps A3.7).
    alb.ingress.kubernetes.io/certificate-arn: {{ .Values.ingress.certificateArn | quote }}
    # Health path for the api targets. The default `/` is served by neither app, and an ALB whose targets ALL fail
    # serves them anyway (fail-open) — so a wrong path would be invisible without the readiness gate (GitOps A3.5).
    # /readyz, not /healthz: a pod whose index is not loaded should receive no traffic.
    alb.ingress.kubernetes.io/healthcheck-path: /readyz
    # A draining target gets no NEW requests; this is how long the ALB waits for the ones in progress before dropping
    # the target. The default is 300 s, far longer than any request here and than a pod's 45 s grace period.
    alb.ingress.kubernetes.io/target-group-attributes: deregistration_delay.timeout_seconds=30
    {{- if has "delivery" .Values.stages }}
    # The api rule's weighted forward. Git holds only its STARTING value — all traffic to stable — because the load
    # balancer controller refuses the whole Ingress (the ui host too) while a `use-annotation` rule names an action that
    # does not exist, and on a rebuild the Rollout that would write it comes after this Ingress. From then on Argo
    # Rollouts owns the weights; the anime-api Application ignores this one annotation so that self-heal does not put
    # 100/0 back in the middle of a canary (deploy/argocd/root/templates/app.yaml).
    alb.ingress.kubernetes.io/actions.anime-api-stable: >-
      {"type":"forward","forwardConfig":{"targetGroups":[
      {"serviceName":"anime-api-stable","servicePort":"8000","weight":100},
      {"serviceName":"anime-api-canary","servicePort":"8000","weight":0}]}}
    {{- end }}
spec:
  ingressClassName: alb
  rules:
    - host: api.{{ .Values.ingress.domain }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              {{- if has "delivery" .Values.stages }}
              # Not a Service port but an ACTION: Argo Rollouts writes the actions.anime-api-stable annotation above
              # (a forward to the stable and canary target groups, with weights), and `use-annotation` tells the load
              # balancer controller to take the rule's target from it.
              service: { name: anime-api-stable, port: { name: use-annotation } }
              {{- else }}
              service: { name: anime-api, port: { number: 8000 } }
              {{- end }}
    - host: {{ .Values.ingress.domain }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              # The UI's Service is in the same namespace, from the anime-ui chart. Its health path is set on that
              # Service with a per-service annotation (anime-ui/templates/service.yaml).
              service: { name: anime-ui, port: { number: 8501 } }
