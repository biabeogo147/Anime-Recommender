# The api's root Service: selects every api pod, whatever its version. Until stage 5 it is also the public ALB's api
# target (pods registered by IP).
apiVersion: v1
kind: Service
metadata:
  name: anime-api
  labels: { app: anime-api }
  annotations:
    argocd.argoproj.io/sync-wave: "-1" # with the Ingress, before the pods
spec:
  selector: { app: anime-api }
  ports:
    - { name: http, port: 8000, targetPort: http }
{{- if has "delivery" .Values.stages }}
{{- range $role := list "stable" "canary" }}
---
# The {{ $role }} Service. Argo Rollouts adds the {{ $role }} ReplicaSet's rollouts-pod-template-hash to its selector, so it
# selects exactly one version; the load balancer controller registers those pods in their own target group, and the
# weighted forward on the Ingress splits requests between the two groups. Nothing scrapes through it: the PodMonitor
# selects pods, so a pod behind three Services is still scraped once (design §6, row 8).
apiVersion: v1
kind: Service
metadata:
  name: anime-api-{{ $role }}
  labels: { app: anime-api }
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  selector: { app: anime-api }
  ports:
    - { name: http, port: 8000, targetPort: http }
{{- end }}
{{- end }}
---
# At most one replica down during a voluntary eviction (a drain). It does nothing against a Spot reclaim — that is
# involuntary; the spread across nodes is what survives it (Terraform A4.3).
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: anime-api
spec:
  minAvailable: 1
  selector:
    matchLabels: { app: anime-api }
