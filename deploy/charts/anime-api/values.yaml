# Values of the api chart. CI (stage 3) rewrites exactly one line here — image.digest — and commits it. The registry,
# the certificate and the live stages are passed by the root app-of-apps (deploy/argocd/root/templates/app.yaml).

# Which build stages are live; set by the root. Later stages switch chart features on from here (stage 5: Rollout).
stages: []

image:
  repository: "" # <registry>/anime-api, from the root's pins
  # Pulled by DIGEST, never by tag: Git records it, Argo CD deploys it, the signature is on it, so all three always name
  # the same image (CI/CD A2.2). Until CI exists, `make image` builds it and prints this value.
  digest: sha256:1c5cc204c9905ebb47b49ea57b03d036fc9e1fbe8debb22aa0948b6151b2921b

# Two replicas, preferably on different nodes. The spread is a preference (ScheduleAnyway), so after a Spot reclaim both
# can land on one node until the next rollout — not a guarantee that a reclaim takes only one (Terraform A4.2).
replicas: 2

# The mode is a property of the whole deployment. `fake` answers without calling a model — for drills only, never the
# default. FAULT_RATE is read ONLY by the fake provider (Delivery A8.2).
llm:
  provider: openai
  # The model each real provider runs, picked by `provider` (_pod.tpl). openai was added on 2026-09-22, when
  # gemini-3.5-flash-lite took about 50 s per call; gemini stays selectable with one line in terraform.tfvars.
  models:
    gemini: gemini-3.5-flash-lite
    openai: gpt-4o-mini
  faultRate: "0"

# Set by the root from api_drill in terraform.tfvars; empty renders nothing. Changing it is a new version of the pod
# template with no other change — the promotion drill (docs/5-delivery/guide.md).
drill: ""

# The canary analysis (stage 5, templates/analysistemplate.yaml). Written down here, beside the Rollout, so the number
# on paper and the number in effect are one value (Delivery A5.4).
analysis:
  prometheus: http://kube-prometheus-stack-prometheus.monitoring.svc:9090
  minRequests: 20       # per two-minute window, below it: inconclusive, pause (Delivery A6.2)
  minSuccessRate: 0.99  # share of canary requests without a 5xx
  maxLatencyRatio: 1.2  # canary p95 over stable p95, same window

# The autoscaler (stage 7, templates/scaledobject.yaml).
scaling:
  minReplicas: 2
  maxReplicas: 8
  # Requests in flight per pod that the HPA aims for: set below stage 4's in-flight per pod at the knee. The chart
  # refuses to render the ScaledObject while this is the placeholder (docs/7-scaling/guide.md, section 0).
  inFlightTarget: MEASURE_IN_STAGE_4
  scaleDownWindowSeconds: 300 # the HPA's scale-down stabilisation window, stated rather than defaulted

# Tracing (stage 8): whether spans carry the prompt and completion (src/anime/telemetry.py, capture_content).
tracing:
  captureContent: "true"

# Starting points, not measurements: stage 4's capacity run replaces them with what a pod used at the knee (Scaling A4.3).
resources:
  requests: { cpu: 250m, memory: 512Mi }
  limits: { memory: 1Gi }

ingress:
  certificateArn: "" # from the root's pins
  domain: anime.recruitai.io.vn # the ui answers on the domain itself, the api on api.<domain>
