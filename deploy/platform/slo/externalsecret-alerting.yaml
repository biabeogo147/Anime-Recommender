# The Discord webhook the SLO alerts are delivered to, copied from anime/alerting into the Secret `anime-alerting` in
# the monitoring namespace, where Alertmanager mounts it (alertmanagerSpec.secrets). Git holds this NAME only; the URL is
# written into Secrets Manager by hand (terraform guide 2.5). The External Secrets role can read anime/alerting: it is
# one of the three ARNs in infra/terraform/cluster/main.tf (Terraform A5.4).
#
# Its own Application, in wave -1 and only with the slo stage: Alertmanager's pod cannot start while a Secret it mounts
# is missing, and the monitoring stack (wave 0) is waited on by every later wave. Gated on the slo stage, so before
# stage 6 nothing waits on it. From stage 6 on, a missing or malformed value stops EVERY bootstrap at wave -1 — the
# gate is unavoidable, since Alertmanager could not start anyway — which is why docs/6-slo/guide.md 0.4 checks it first.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: anime-alerting
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secrets-manager
  target:
    name: anime-alerting
    creationPolicy: Owner
  data:
    - secretKey: DISCORD_WEBHOOK_URL
      remoteRef:
        key: anime/alerting
        property: DISCORD_WEBHOOK_URL
