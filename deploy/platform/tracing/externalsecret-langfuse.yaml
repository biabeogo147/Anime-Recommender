# Langfuse's OTLP endpoint takes HTTP Basic auth: base64 of "<public key>:<secret key>". External Secrets builds that
# header value from anime/langfuse, so the collector reads one ready-made value and neither key is in Git, in the
# rendered config, or in Terraform state (design §4.2). The External Secrets role can read anime/langfuse: it is one of
# the three ARNs in infra/terraform/cluster/main.tf (Terraform A5.4).
#
# Its own Application, in wave -1 and only with the tracing stage, for the same reason as the alerting secret: the
# collector cannot start without it. Before stage 8 nothing waits on it; from stage 8 on, a missing value stops every
# bootstrap at wave -1, which is why docs/8-tracing/guide.md checks it first.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: anime-langfuse
  namespace: tracing
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secrets-manager
  target:
    name: anime-langfuse
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        LANGFUSE_AUTH: '{{ printf "%s:%s" .public .secret | b64enc }}'
  data:
    - secretKey: public
      remoteRef: { key: anime/langfuse, property: LANGFUSE_PUBLIC_KEY }
    - secretKey: secret
      remoteRef: { key: anime/langfuse, property: LANGFUSE_SECRET_KEY }
