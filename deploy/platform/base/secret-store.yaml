# Where External Secrets reads from, and as whom: Secrets Manager in this region, with the controller's own Pod
# Identity role — no `auth:` block means the AWS SDK's default chain, which is where Pod Identity credentials appear.
# That role may read exactly anime/llm, anime/langfuse and anime/alerting; anything else is AccessDenied, by design.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: aws-secrets-manager
spec:
  provider:
    aws:
      service: SecretsManager
      region: ap-southeast-1
