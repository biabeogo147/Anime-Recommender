# The default StorageClass. EKS creates none that is marked default, so a PVC without a class (Prometheus's) would stay
# Pending for ever. gp3: cheaper than gp2 at the same size, encrypted like everything else here.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: gp3
  annotations:
    storageclass.kubernetes.io/is-default-class: "true"
provisioner: ebs.csi.aws.com
parameters:
  type: gp3
  encrypted: "true"
# Delete: the EBS volume goes with its PVC. `make down` deletes every PVC and waits for these volumes before it destroys
# the cluster, so none survives unreachable and billed.
reclaimPolicy: Delete
# A volume is created in the zone of the node that will use it, never in a zone with no node.
volumeBindingMode: WaitForFirstConsumer
allowVolumeExpansion: true
