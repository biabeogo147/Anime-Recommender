# The model keys the api needs: GOOGLE_API_KEY and HF_TOKEN, copied from anime/llm into the Secret `anime-llm`.
# Git holds this NAME only. Adding a secret later takes two changes in two places — a line in the External Secrets
# policy (Terraform) and an ExternalSecret here (Git) — and forgetting the first fails loudly with AccessDenied
# (GitOps A4.2). anime/langfuse and anime/alerting get their ExternalSecrets in the stages that use them (8 and 6).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: anime-llm
  namespace: anime
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secrets-manager
  target:
    name: anime-llm
    creationPolicy: Owner # the Secret is deleted with this object
  dataFrom:
    - extract:
        key: anime/llm # every JSON key of the secret becomes a key of the Kubernetes Secret
