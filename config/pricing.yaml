# USD per 1M tokens, Gemini API paid tier "Standard" list prices.
# Source: https://ai.google.dev/gemini-api/docs/pricing (page last updated 2026-09-11, checked 2026-09-15).
# The free tier is used in practice, so these values estimate what traffic would cost on the paid tier.
# Thinking tokens are billed as output tokens.
models:
  gemini-3.5-flash-lite:
    input_per_1m: 0.30
    output_per_1m: 2.50
  gemini-3.6-flash:
    input_per_1m: 0.75
    output_per_1m: 3.75
  gemma-4-26b-a4b-it:
    input_per_1m: 0.0
    output_per_1m: 0.0
  fake:
    input_per_1m: 0.30
    output_per_1m: 2.50
