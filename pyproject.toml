[project]
name = "anime-recommender"
version = "0.2.0"
description = "Anime recommender: FastAPI RAG API + Streamlit UI"
authors = [{ name = "biabeogo147", email = "biabeogo147@gmail.com" }]
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = []

[dependency-groups]
api = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "prometheus-client>=0.22",
    "pyyaml>=6",
    "langchain-core>=1.0,<2",
    "langchain-chroma>=1.0,<2",
    "chromadb>=1.0,<2",
    "langchain-google-genai>=4,<5",
    "langchain-huggingface>=1,<2",
    "opentelemetry-sdk>=1.27",
    "opentelemetry-exporter-otlp-proto-http>=1.27",
    "opentelemetry-instrumentation-fastapi>=0.48b0",
]
ui = [
    "streamlit>=1.40",
    "httpx>=0.27",
]
dev = [
    { include-group = "api" },
    "pytest>=8",
    "ruff>=0.6",
    "httpx>=0.27",
]

[tool.uv]
package = false
default-groups = ["dev"]
# Images run on linux/amd64 only; restricting the lock keeps resolution fast and the lockfile small.
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
src = ["src", "services", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["anime", "services"]
